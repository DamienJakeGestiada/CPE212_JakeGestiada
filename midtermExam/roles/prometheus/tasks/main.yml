---
#task 1

- name: Update Ubuntu package repository
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts.os_family == "Debian"
  tags:
    - task1

- name: Upgrade Ubuntu packages
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_facts.os_family == "Debian"
  tags:
    - task1

- name: Update CentOS packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when: ansible_facts.os_family == "RedHat"
  tags:
    - task1

- name: Install required utilities
  ansible.builtin.package:
    name:
      - wget
      - tar
      - curl
    state: present
  tags:
    - task1

#task 2

- name: Create Prometheus group
  ansible.builtin.group:
    name: prometheus
    state: present
  tags:
    - task2

- name: Create Prometheus user
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    shell: "{{ '/usr/sbin/nologin' if ansible_facts.os_family == 'Debian' else '/sbin/nologin' }}"
    create_home: false
    system: true
    state: present
  tags:
    - task2

- name: Verify Prometheus user
  ansible.builtin.command:
    cmd: getent passwd prometheus
  register: prometheus_user
  changed_when: false
  tags:
    - task2

- name: Display Prometheus user
  ansible.builtin.debug:
    var: prometheus_user.stdout
  tags:
    - task2

#task 3

- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  tags:
    - task3

- name: Create Prometheus data directory
  ansible.builtin.file:
    path: /var/lib/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  tags:
    - task3

- name: Verify Prometheus directories
  ansible.builtin.command:
    cmd: ls -ld /etc/prometheus /var/lib/prometheus
  register: prometheus_directories
  changed_when: false
  tags:
    - task3

- name: Display Prometheus directories
  ansible.builtin.debug:
    var: prometheus_directories.stdout_lines
  tags:
    - task3

#task 4

- name: Download Prometheus archive
  ansible.builtin.get_url:
    url: https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz
    dest: /tmp/prometheus-3.14.0.linux-amd64.tar.gz
    mode: '0644'
  tags:
    - task4

- name: Verify downloaded Prometheus archive
  ansible.builtin.command:
    cmd: ls -lh /tmp/prometheus-3.14.0.linux-amd64.tar.gz
  register: prometheus_archive
  changed_when: false
  tags:
    - task4

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: /tmp/prometheus-3.14.0.linux-amd64.tar.gz
    dest: /tmp/
    remote_src: true
  tags:
    - task4

- name: Verify extracted Prometheus directory
  ansible.builtin.command:
    cmd: ls -ld /tmp/prometheus-3.14.0.linux-amd64
  register: prometheus_extracted
  changed_when: false
  tags:
    - task4

- name: Display downloaded and extracted Prometheus
  ansible.builtin.debug:
    msg:
      - "{{ prometheus_archive.stdout }}"
      - "{{ prometheus_extracted.stdout }}"
  tags:
    - task4

#task 5

- name: Copy Prometheus binary
  ansible.builtin.copy:
    src: /tmp/prometheus-3.14.0.linux-amd64/prometheus
    dest: /usr/local/bin/prometheus
    owner: prometheus
    group: prometheus
    mode: '0755'
    remote_src: true
  tags:
    - task5

- name: Copy Promtool binary
  ansible.builtin.copy:
    src: /tmp/prometheus-3.14.0.linux-amd64/promtool
    dest: /usr/local/bin/promtool
    owner: prometheus
    group: prometheus
    mode: '0755'
    remote_src: true
  tags:
    - task5

- name: Verify Prometheus binary exists
  ansible.builtin.command:
    cmd: ls -l /usr/local/bin/prometheus
  register: prometheus_binary
  changed_when: false
  tags:
    - task5

- name: Verify Promtool binary exists
  ansible.builtin.command:
    cmd: ls -l /usr/local/bin/promtool
  register: promtool_binary
  changed_when: false
  tags:
    - task5

- name: Check Prometheus version
  ansible.builtin.command:
    cmd: /usr/local/bin/prometheus --version
  register: prometheus_version
  changed_when: false
  tags:
    - task5

- name: Check Promtool version
  ansible.builtin.command:
    cmd: /usr/local/bin/promtool --version
  register: promtool_version
  changed_when: false
  tags:
    - task5

- name: Display Prometheus binary
  ansible.builtin.debug:
    var: prometheus_binary.stdout
  tags:
    - task5

- name: Display Promtool binary
  ansible.builtin.debug:
    var: promtool_binary.stdout
  tags:
    - task5

- name: Display Prometheus version
  ansible.builtin.debug:
    var: prometheus_version.stdout
  tags:
    - task5

- name: Display Promtool version
  ansible.builtin.debug:
    var: promtool_version.stdout
  tags:
    - task5


#task 6

- name: Copy Prometheus configuration file
  ansible.builtin.copy:
    src: /tmp/prometheus-3.14.0.linux-amd64/prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
    remote_src: true
  tags:
    - task6

- name: Create Prometheus consoles directory
  ansible.builtin.file:
    path: /etc/prometheus/consoles
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  tags:
    - task6

- name: Create Prometheus console libraries directory
  ansible.builtin.file:
    path: /etc/prometheus/console_libraries
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  tags:
    - task6

- name: Set Prometheus configuration ownership
  ansible.builtin.file:
    path: /etc/prometheus
    owner: prometheus
    group: prometheus
    recurse: true
  tags:
    - task6

- name: Verify Prometheus configuration files
  ansible.builtin.command:
    cmd: ls -l /etc/prometheus
  register: prometheus_config_files
  changed_when: false
  tags:
    - task6

- name: Display Prometheus configuration files
  ansible.builtin.debug:
    var: prometheus_config_files.stdout_lines
  tags:
    - task6

#task 7

- name: Validate Prometheus configuration
  ansible.builtin.command:
    cmd: /usr/local/bin/promtool check config /etc/prometheus/prometheus.yml
  register: prometheus_config_check
  changed_when: false
  tags:
    - task7

- name: Display Prometheus configuration validation
  ansible.builtin.debug:
    var: prometheus_config_check.stdout_lines
  tags:
    - task7

#task 8

- name: Create Prometheus systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Monitoring System
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  tags:
    - task8

- name: Verify Prometheus systemd service file
  ansible.builtin.command:
    cmd: cat /etc/systemd/system/prometheus.service
  register: prometheus_service_file
  changed_when: false
  tags:
    - task8

- name: Display Prometheus systemd service
  ansible.builtin.debug:
    var: prometheus_service_file.stdout_lines
  tags:
    - task8

#task 9

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  tags:
    - task9

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
  tags:
    - task9

- name: Check Prometheus service status
  ansible.builtin.command:
    cmd: systemctl is-active prometheus
  register: prometheus_status
  changed_when: false
  tags:
    - task9

- name: Display Prometheus service status
  ansible.builtin.debug:
    var: prometheus_status.stdout
  tags:
    - task9

#task 10 verify

- name: Check Prometheus port 9090
  ansible.builtin.shell:
    cmd: ss -tlnp | grep :9090
  register: prometheus_port
  changed_when: false
  tags:
    - task10

- name: Display Prometheus port
  ansible.builtin.debug:
    var: prometheus_port.stdout
  tags:
    - task10

- name: Test Prometheus HTTP response
  ansible.builtin.command:
    cmd: curl -fsS http://localhost:9090
  register: prometheus_http
  changed_when: false
  tags:
    - task10

- name: Display Prometheus HTTP response
  ansible.builtin.debug:
    msg: "Prometheus HTTP response received successfully."
  when: prometheus_http.rc == 0
  tags:
    - task10

- name: Check Prometheus readiness
  ansible.builtin.command:
    cmd: curl -fsS http://localhost:9090/-/ready
  register: prometheus_ready
  changed_when: false
  tags:
    - task10

- name: Display Prometheus readiness
  ansible.builtin.debug:
    var: prometheus_ready.stdout
  tags:
    - task10

- name: Check Prometheus version
  ansible.builtin.command:
    cmd: /usr/local/bin/prometheus --version
  register: prometheus_final_version
  changed_when: false
  tags:
    - task10

- name: Display Prometheus version
  ansible.builtin.debug:
    var: prometheus_final_version.stdout
  tags:
    - task10

- name: Check Prometheus service
  ansible.builtin.command:
    cmd: systemctl is-active prometheus
  register: prometheus_final_status
  changed_when: false
  tags:
    - task10

- name: Display Prometheus service status
  ansible.builtin.debug:
    var: prometheus_final_status.stdout
  tags:
    - task10
