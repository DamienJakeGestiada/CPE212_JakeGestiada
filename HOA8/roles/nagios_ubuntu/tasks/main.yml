---
- name: Update Ubuntu package repository
  ansible.builtin.apt:
    update_cache: true

- name: Install Nagios Core prerequisites
  ansible.builtin.apt:
    name:
      - autoconf
      - gcc
      - libc6
      - make
      - wget
      - unzip
      - apache2
      - php
      - libapache2-mod-php
      - libgd-dev
      - ufw
      - openssl
      - libssl-dev
      - apache2-utils
    state: present

- name: Install Nagios Plugin prerequisites
  ansible.builtin.apt:
    name:
      - libmcrypt-dev
      - bc
      - gawk
      - dc
      - build-essential
      - snmp
      - libnet-snmp-perl
      - gettext
      - iputils-ping
    state: present

- name: Download Nagios Core source
  ansible.builtin.shell: >
    wget -O /tmp/nagioscore.tar.gz
    $(wget -q -O -
    https://api.github.com/repos/NagiosEnterprises/nagioscore/releases/latest |
    grep '"browser_download_url":' |
    grep -o 'https://[^"]*')
  args:
    creates: /tmp/nagioscore.tar.gz

- name: Extract Nagios Core source
  ansible.builtin.unarchive:
    src: /tmp/nagioscore.tar.gz
    dest: /tmp
    remote_src: true

- name: Find Nagios Core source directory
  ansible.builtin.find:
    paths: /tmp
    patterns: "nagios-*"
    file_type: directory
  register: nagios_source

- name: Configure Nagios Core
  ansible.builtin.command:
    cmd: ./configure --with-httpd-conf=/etc/apache2/sites-enabled
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Compile Nagios Core
  ansible.builtin.command:
    cmd: make all
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Create Nagios user and group
  ansible.builtin.command:
    cmd: make install-groups-users
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Add Apache user to Nagios group
  ansible.builtin.user:
    name: www-data
    groups: nagios
    append: true

- name: Install Nagios Core
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Install Nagios service
  ansible.builtin.command:
    cmd: make install-daemoninit
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Install Nagios command mode
  ansible.builtin.command:
    cmd: make install-commandmode
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Install Nagios configuration
  ansible.builtin.command:
    cmd: make install-config
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Install Nagios Apache configuration
  ansible.builtin.command:
    cmd: make install-webconf
    chdir: "{{ nagios_source.files | map(attribute='path') | select('match', '/tmp/nagios-[0-9].*') | first }}"

- name: Enable Apache rewrite module
  ansible.builtin.command:
    cmd: a2enmod rewrite

- name: Enable Apache CGI module
  ansible.builtin.command:
    cmd: a2enmod cgi

- name: Allow Apache through UFW
  ansible.builtin.command:
    cmd: ufw allow Apache

- name: Reload UFW
  ansible.builtin.command:
    cmd: ufw reload

- name: Create Nagios web authentication account
  ansible.builtin.command:
    cmd: htpasswd -b -c /usr/local/nagios/etc/htpasswd.users nagiosadmin nagiosadmin

- name: Install Nagios Plugins
  ansible.builtin.shell: >
    wget -O /tmp/nagios-plugins.tar.gz
    $(wget -q -O -
    https://api.github.com/repos/nagios-plugins/nagios-plugins/releases/latest |
    grep '"browser_download_url":' |
    grep -o 'https://[^"]*')
  args:
    creates: /tmp/nagios-plugins.tar.gz

- name: Extract Nagios Plugins
  ansible.builtin.unarchive:
    src: /tmp/nagios-plugins.tar.gz
    dest: /tmp
    remote_src: true

- name: Find Nagios Plugins directory
  ansible.builtin.find:
    paths: /tmp
    patterns: "nagios-plugins-*"
    file_type: directory
  register: plugin_source

- name: Configure Nagios Plugins
  ansible.builtin.command:
    cmd: ./configure
    chdir: "{{ plugin_source.files[0].path }}"

- name: Compile Nagios Plugins
  ansible.builtin.command:
    cmd: make
    chdir: "{{ plugin_source.files[0].path }}"

- name: Install Nagios Plugins
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ plugin_source.files[0].path }}"

- name: Restart Apache
  ansible.builtin.service:
    name: apache2
    state: restarted
    enabled: true

- name: Validate Nagios configuration
  ansible.builtin.command:
    cmd: /usr/local/nagios/bin/nagios -v /usr/local/nagios/etc/nagios.cfg
  changed_when: false

- name: Start and enable Nagios
  ansible.builtin.service:
    name: nagios
    state: started
    enabled: true
