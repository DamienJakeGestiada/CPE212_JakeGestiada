---
- name: Update Ubuntu packages
  ansible.builtin.apt:
    update_cache: true

- name: Install Nagios Core prerequisites
  ansible.builtin.apt:
    name:
      - autoconf
      - gcc
      - libc6
      - make
      - wget
      - unzip
      - apache2
      - apache2-utils
      - php
      - libapache2-mod-php
      - libgd-dev
      - ufw
      - openssl
      - libssl-dev
    state: present

- name: Check whether Nagios Core is already installed
  ansible.builtin.stat:
    path: /usr/local/nagios/bin/nagios
  register: nagios_core

- name: Download Nagios Core source
  ansible.builtin.get_url:
    url: https://github.com/NagiosEnterprises/nagioscore/archive/refs/tags/nagios-4.5.14.tar.gz
    dest: /tmp/nagios-4.5.14.tar.gz
    mode: "0644"
  when: not nagios_core.stat.exists

- name: Extract Nagios Core source
  ansible.builtin.unarchive:
    src: /tmp/nagios-4.5.14.tar.gz
    dest: /tmp
    remote_src: true
  when: not nagios_core.stat.exists

- name: Configure Nagios Core
  ansible.builtin.command:
    cmd: ./configure --with-httpd-conf=/etc/apache2/sites-enabled
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Compile Nagios Core
  ansible.builtin.command:
    cmd: make all
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Create Nagios groups and users
  ansible.builtin.command:
    cmd: make install-groups-users
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Add Apache user to Nagios group
  ansible.builtin.user:
    name: www-data
    groups: nagios
    append: true

- name: Install Nagios Core
  ansible.builtin.command:
    cmd: make install
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios daemon
  ansible.builtin.command:
    cmd: make install-daemoninit
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios command mode
  ansible.builtin.command:
    cmd: make install-commandmode
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios configuration
  ansible.builtin.command:
    cmd: make install-config
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios Apache configuration
  ansible.builtin.command:
    cmd: make install-webconf
    chdir: /tmp/nagioscore-nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Enable Apache rewrite module
  ansible.builtin.command:
    cmd: a2enmod rewrite

- name: Enable Apache CGI module
  ansible.builtin.command:
    cmd: a2enmod cgi

- name: Allow Apache through UFW
  ansible.builtin.command:
    cmd: ufw allow Apache

- name: Enable and restart Apache
  ansible.builtin.service:
    name: apache2
    enabled: true
    state: restarted

- name: Enable and start Nagios
  ansible.builtin.service:
    name: nagios
    enabled: true
    state: started
