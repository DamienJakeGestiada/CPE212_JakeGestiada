---
- name: Install CentOS Nagios prerequisites
  ansible.builtin.dnf:
    name:
      - gcc
      - glibc
      - glibc-common
      - perl
      - httpd
      - php
      - wget
      - gd
      - gd-devel
      - s-nail
      - postfix
      - openssl-devel
      - httpd-tools
    state: present

- name: Check whether Nagios Core is already installed
  ansible.builtin.stat:
    path: /usr/local/nagios/bin/nagios
  register: nagios_core

- name: Download Nagios Core source
  ansible.builtin.get_url:
    url: https://github.com/NagiosEnterprises/nagioscore/releases/download/nagios-4.5.14/nagios-4.5.14.tar.gz
    dest: /tmp/nagios-4.5.14.tar.gz
    mode: "0644"
  when: not nagios_core.stat.exists

- name: Extract Nagios Core source
  ansible.builtin.unarchive:
    src: /tmp/nagios-4.5.14.tar.gz
    dest: /tmp
    remote_src: true
  when: not nagios_core.stat.exists

- name: Configure Nagios Core
  ansible.builtin.command:
    cmd: ./configure
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Compile Nagios Core
  ansible.builtin.command:
    cmd: make all
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Create Nagios groups and users
  ansible.builtin.command:
    cmd: make install-groups-users
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Add Apache user to Nagios group
  ansible.builtin.user:
    name: apache
    groups: nagios
    append: true
  when: not nagios_core.stat.exists

- name: Install Nagios Core
  ansible.builtin.command:
    cmd: make install
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios daemon
  ansible.builtin.command:
    cmd: make install-daemoninit
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios command mode
  ansible.builtin.command:
    cmd: make install-commandmode
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios configuration
  ansible.builtin.command:
    cmd: make install-config
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Install Nagios Apache configuration
  ansible.builtin.command:
    cmd: make install-webconf
    chdir: /tmp/nagios-4.5.14
  when: not nagios_core.stat.exists

- name: Allow HTTP through firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --add-port=80/tcp

- name: Reload firewalld
  ansible.builtin.command:
    cmd: firewall-cmd --reload

- name: Enable and start Apache
  ansible.builtin.service:
    name: httpd
    enabled: true
    state: started

- name: Enable and start Nagios
  ansible.builtin.service:
    name: nagios
    enabled: true
    state: started
