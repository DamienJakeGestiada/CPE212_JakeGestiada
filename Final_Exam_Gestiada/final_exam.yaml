---

- name: Download Monitoring Archives on Control Node
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - config.yaml

  tasks:
    - name: Download Node Exporter on control node
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter.version }}/node_exporter-{{ node_exporter.version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter.version }}.linux-amd64.tar.gz"
        mode: "0644"

    - name: Download Prometheus on control node
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus.version }}/prometheus-{{ prometheus.version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus-{{ prometheus.version }}.linux-amd64.tar.gz"
        mode: "0644"



- name: Configure MOTD and Node Exporter
  hosts: enterprise_servers
  become: true
  gather_facts: true

  vars_files:
    - config.yaml

  tasks:
    - name: Configure MOTD
      ansible.builtin.copy:
        dest: /etc/motd
        content: "Ansible Managed by {{ motd_username }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Create Node Exporter system user
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Copy Node Exporter archive to managed server
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter.version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        owner: root
        group: root
        mode: "0644"

    - name: Create Node Exporter extraction directory
      ansible.builtin.file:
        path: /tmp/node_exporter_extract
        state: directory
        mode: "0755"

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/node_exporter_extract
        remote_src: true
        creates: "/tmp/node_exporter_extract/node_exporter-{{ node_exporter.version }}.linux-amd64/node_exporter"

    - name: Install Node Exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter_extract/node_exporter-{{ node_exporter.version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart Node Exporter

    - name: Configure Node Exporter service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter.port }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify: Restart Node Exporter

    - name: Start and enable Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true


#Instlatation of Prometheus ubuntu

- name: Install and Configure Prometheus
  hosts: prometheus_server
  become: true
  gather_facts: true

  vars_files:
    - config.yaml

  tasks:
    - name: Create Prometheus system user
      ansible.builtin.user:
        name: prometheus
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create Prometheus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Copy Prometheus archive to Ubuntu
      ansible.builtin.copy:
        src: "/tmp/prometheus-{{ prometheus.version }}.linux-amd64.tar.gz"
        dest: /tmp/prometheus.tar.gz
        owner: root
        group: root
        mode: "0644"

    - name: Create Prometheus extraction directory
      ansible.builtin.file:
        path: /tmp/prometheus_extract
        state: directory
        mode: "0755"

    - name: Extract Prometheus
      ansible.builtin.unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp/prometheus_extract
        remote_src: true
        creates: "/tmp/prometheus_extract/prometheus-{{ prometheus.version }}.linux-amd64/prometheus"

    - name: Install Prometheus binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus_extract/prometheus-{{ prometheus.version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop:
        - prometheus
        - promtool
      notify: Restart Prometheus

    - name: Configure Prometheus scrape targets
      ansible.builtin.copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets:
                    - "127.0.0.1:{{ prometheus.port }}"

            - job_name: node_exporter
              static_configs:
                - targets: {{ monitoring_targets | to_json }}
        owner: prometheus
        group: prometheus
        mode: "0644"
      notify: Restart Prometheus

    - name: Validate Prometheus configuration
      ansible.builtin.command:
        argv:
          - /usr/local/bin/promtool
          - check
          - config
          - /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Configure Prometheus systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus Monitoring
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus --web.listen-address=:{{ prometheus.port }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify: Restart Prometheus

    - name: Start and enable Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
        daemon_reload: true
